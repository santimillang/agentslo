services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    ports: ["8123:8123", "9000:9000"]
    environment:
      CLICKHOUSE_DB: otel
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8123/ping"]
      interval: 5s
      retries: 20

  collector:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.collector
    ports: ["4317:4317", "4318:4318"]
    depends_on:
      clickhouse: { condition: service_healthy }

  grafana:
    image: grafana/grafana:13.3.0
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_PLUGINS_PREINSTALL_SYNC: grafana-clickhouse-datasource@4.23.4
      # Local demo only: open the dashboard without logging in.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/agentslo.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      clickhouse: { condition: service_healthy }

  fakeagent:
    build: ../examples/fakeagent
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      SCENARIO: ${SCENARIO:-mixed}
    depends_on: [collector]
